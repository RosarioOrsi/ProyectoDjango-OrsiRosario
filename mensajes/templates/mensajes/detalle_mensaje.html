{% extends 'base.html' %}

{% block content %}

<div style="max-width: 700px; margin: 40px auto;">
    <h1 style="margin-bottom: 5px;">📨 {{ mensaje.asunto }}</h1>
    <p style="color: #888; margin-bottom: 30px;">
        De: <strong style="color:#fff;">{{ mensaje.remitente.username }}</strong> 
        → Para: <strong style="color:#fff;">{{ mensaje.destinatario.username }}</strong>
        <span style="margin-left: 15px;">{{ mensaje.fecha|date:"d/m/Y H:i" }}</span>
    </p>

    <div style="background: #1e1e1e; border-left: 4px solid #c0392b; padding: 30px; border-radius: 8px; margin-bottom: 30px;">
        <p style="line-height: 1.8;">{{ mensaje.cuerpo }}</p>
    </div>

    <div style="display: flex; gap: 15px;">
        <a href="{% url 'bandeja_entrada' %}" class="btn btn-gris">← Volver</a>
        <a href="{% url 'eliminar_mensaje' mensaje.pk %}" class="btn" style="background: #7b0000;">🗑️ Eliminar</a>
    </div>
</div>

{% endblock %}
