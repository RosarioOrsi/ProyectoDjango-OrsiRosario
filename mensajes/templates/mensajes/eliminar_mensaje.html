{% extends 'base.html' %}

{% block content %}

<div style="max-width: 500px; margin: 60px auto; text-align: center;">
    <h1 style="margin-bottom: 10px;">⚠️ Eliminar Mensaje</h1>
    <p style="color: #aaa; margin-bottom: 30px;">¿Estás segura de que querés eliminar este mensaje?</p>

    <div style="background: #1e1e1e; border-left: 4px solid #c0392b; padding: 20px; border-radius: 8px; margin-bottom: 30px; text-align: left;">
        <p><strong>Asunto:</strong> {{ mensaje.asunto }}</p>
        <p style="margin-top: 8px;"><strong>De:</strong> {{ mensaje.remitente.username }}</p>
        <p style="margin-top: 8px;"><strong>Fecha:</strong> {{ mensaje.fecha|date:"d/m/Y H:i" }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button class="btn" type="submit" style="background: #7b0000;">Sí, eliminar</button>
        <a href="{% url 'bandeja_entrada' %}" class="btn btn-gris" style="margin-left: 15px;">Cancelar</a>
    </form>
</div>

{% endblock %}
