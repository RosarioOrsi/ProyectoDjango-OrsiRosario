{% extends 'base.html' %}

{% block content %}

<div style="max-width: 400px; margin: 60px auto; text-align: center;">
    <h2 style="margin-bottom: 20px; color: #c0392b;">Iniciar Sesión</h2>

    {% if messages %}
        {% for message in messages %}
            <p style="color: #e74c3c; margin-bottom: 10px;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" style="background: #1e1e1e; padding: 30px; border-radius: 8px; border: 1px solid #333; text-align: left;">
        {% csrf_token %}
        <label>Usuario</label>
        <input type="text" name="username" required>
        <label>Contraseña</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit" style="width: 100%; margin-top: 10px;">Iniciar Sesión</button>
    </form>

    <p style="margin-top: 15px;">
        No tenes cuenta? <a href="{% url 'register' %}" style="color: #e74c3c;">Registrate aca</a>
    </p>
</div>

{% endblock %}
